services:
  db:
    image: 'postgres:latest'
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: greenlight
      POSTGRES_USER: greenlight
      POSTGRES_PASSWORD: pa55word
    container_name: greenlight
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
